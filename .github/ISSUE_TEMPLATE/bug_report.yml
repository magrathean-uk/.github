name: Bug report
description: Report a reproducible defect in this repository
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report vulnerabilities privately using the affected repository's security policy, or the [shared security policy](https://github.com/magrathean-uk/.github/blob/main/SECURITY.md) if it has none. Do not include credentials, personal data, production configuration, or licensed private assets.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release, build, package version, image tag, or commit SHA where the defect occurs.
      placeholder: "v1.2.3, build 42, or abc1234"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, device or architecture, runtime/toolchain, deployment mode, and relevant dependency versions.
      placeholder: "Operating system and version; browser or runtime if relevant"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Defect
      description: Describe the failure and its practical impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence that reproduces the defect.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: State the result you expected and the contract or documentation supporting it.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: State what happened instead, including exact errors or exit codes.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Sanitised evidence
      description: Add minimal logs, stack traces, screenshots, or diagnostic output after removing sensitive data.
      render: shell

  - type: textarea
    id: regression
    attributes:
      label: Regression and workarounds
      description: Note the last known working version, frequency, workaround, and whether data or service availability is at risk.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: I removed credentials, personal data, production secrets, and other sensitive material.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
